name: Build MiniBox firmware from ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minibox-build-0104
  cancel-in-progress: false

env:
  ARCHIVE: MiniBox-MFP-Firmware-Build-0104-AR9330-OPENWRT-25.12.5-CANDIDATE-BUILD-KIT.zip
  EXPECTED_SHA256: 77974510f54a23dd633d5f451eac72cec432116bb01710a46bd0b8bb3f050381
  OPENWRT_TAG: v25.12.5
  OPENWRT_DIR: openwrt-src
  DIST_DIR: dist

jobs:
  build:
    name: OpenWrt 25.12.5 / MiniBox V1
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check ZIP and SHA-256
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: ZIP archive is missing from the repository root:"
            echo "$ARCHIVE"
            exit 1
          fi

          echo "$EXPECTED_SHA256  $ARCHIVE" | sha256sum -c -

      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          df -h

      - name: Install OpenWrt build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            autoconf \
            automake \
            autopoint \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libelf-dev \
            libgmp-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses-dev \
            libssl-dev \
            libtool \
            libzstd-dev \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            rsync \
            swig \
            subversion \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            ca-certificates \
            cmake \
            ninja-build \
            pkgconf \
            jq \
            xz-utils \
            zstd \
            cpio \
            device-tree-compiler \
            patch \
            perl \
            tar

      - name: Extract Build-0104 ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ARCHIVE" -d extracted

          KIT_ROOT="$(find extracted -type f -name BUILD_INFO.md -printf '%h\n' -quit)"

          if [ -z "$KIT_ROOT" ]; then
            KIT_ROOT="$(find extracted -mindepth 1 -maxdepth 1 -type d -print -quit)"
          fi

          if [ -z "$KIT_ROOT" ] || [ ! -d "$KIT_ROOT" ]; then
            echo "ERROR: Cannot determine the Build-0104 root directory."
            find extracted -maxdepth 5 -print
            exit 1
          fi

          echo "KIT_ROOT=$KIT_ROOT" >> "$GITHUB_ENV"

          echo "Build kit root:"
          echo "$KIT_ROOT"

          find "$KIT_ROOT" -maxdepth 7 -type f | sort > extracted-tree.txt

          echo
          echo "First 250 files in the archive:"
          sed -n '1,250p' extracted-tree.txt

      - name: Clone pinned OpenWrt source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$OPENWRT_DIR"

          git clone \
            --depth 1 \
            --branch "$OPENWRT_TAG" \
            https://git.openwrt.org/openwrt/openwrt.git \
            "$OPENWRT_DIR"

          git -C "$OPENWRT_DIR" describe --tags --exact-match

      - name: Detect and inject MiniBox target and package
        shell: bash
        run: |
          set -euo pipefail

          ATH79_DIR="$(find "$KIT_ROOT" \
            -type d \
            -path '*/target/linux/ath79' \
            -print -quit)"

          if [ -z "$ATH79_DIR" ]; then
            echo "ERROR: target/linux/ath79 was not found inside Build-0104."
            find "$KIT_ROOT" -maxdepth 8 -type d | sort
            exit 1
          fi

          OVERLAY_ROOT="${ATH79_DIR%/target/linux/ath79}"

          echo "OpenWrt overlay root:"
          echo "$OVERLAY_ROOT"

          DEVICE_ID="$(
            python3 - "$ATH79_DIR/image" <<'PY'
          import pathlib
          import re
          import sys

          image_dir = pathlib.Path(sys.argv[1])

          if not image_dir.is_dir():
              raise SystemExit(1)

          candidates = []

          for path in sorted(image_dir.rglob("*")):
              if not path.is_file():
                  continue

              text = path.read_text(encoding="utf-8", errors="ignore")

              for match in re.finditer(
                  r"^\s*define\s+Device/([^\s]+)",
                  text,
                  flags=re.MULTILINE,
              ):
                  device = match.group(1).strip()
                  if "minibox" in device.lower():
                      candidates.append(device)

              for match in re.finditer(
                  r"^\s*TARGET_DEVICES\s*\+=\s*(.+)$",
                  text,
                  flags=re.MULTILINE,
              ):
                  for device in match.group(1).split():
                      if "minibox" in device.lower():
                          candidates.append(device.strip())

          candidates = sorted(set(candidates))

          if not candidates:
              raise SystemExit(1)

          preferred = "gainstrong_minibox-v1"

          if preferred in candidates:
              print(preferred)
          else:
              print(candidates[0])
          PY
          )"

          if [ -z "$DEVICE_ID" ]; then
            echo "ERROR: Could not detect a MiniBox device definition."
            echo
            echo "MiniBox references inside the supplied ath79 tree:"
            grep -Rni 'minibox' "$ATH79_DIR" | head -n 150 || true
            exit 1
          fi

          echo "Detected OpenWrt device ID:"
          echo "$DEVICE_ID"

          rsync -a \
            "$OVERLAY_ROOT/target/" \
            "$OPENWRT_DIR/target/"

          if [ -d "$OVERLAY_ROOT/package" ]; then
            rsync -a \
              "$OVERLAY_ROOT/package/" \
              "$OPENWRT_DIR/package/"
          fi

          PACKAGE_DIR="$(find "$KIT_ROOT" \
            -type d \
            -path '*/package/minibox-mfp' \
            -print -quit)"

          if [ -n "$PACKAGE_DIR" ]; then
            rm -rf "$OPENWRT_DIR/package/minibox-mfp"
            cp -a \
              "$PACKAGE_DIR" \
              "$OPENWRT_DIR/package/minibox-mfp"
          fi

          if [ -d "$OVERLAY_ROOT/files" ]; then
            mkdir -p "$OPENWRT_DIR/files"
            rsync -a \
              "$OVERLAY_ROOT/files/" \
              "$OPENWRT_DIR/files/"
          fi

          if ! grep -RiqF \
            "$DEVICE_ID" \
            "$OPENWRT_DIR/target/linux/ath79"; then
            echo "ERROR: The detected MiniBox device was not copied into OpenWrt."
            echo "DEVICE_ID=$DEVICE_ID"
            exit 1
          fi

          if [ ! -f "$OPENWRT_DIR/package/minibox-mfp/Makefile" ]; then
            echo "ERROR: package/minibox-mfp/Makefile was not injected."
            find "$KIT_ROOT" -maxdepth 8 -path '*minibox-mfp*' -print
            exit 1
          fi

          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

          echo
          echo "MiniBox references after injection:"
          grep -Rni \
            --exclude='*.o' \
            --exclude='*.bin' \
            'minibox' \
            "$OPENWRT_DIR/target/linux/ath79" \
            | head -n 150 || true

          echo
          echo "MiniBox target and package injection: PASS"

      - name: Configure OpenWrt
        shell: bash
        working-directory: openwrt-src
        run: |
          set -euo pipefail

          if [ -z "${DEVICE_ID:-}" ]; then
            echo "ERROR: DEVICE_ID is not set."
            exit 1
          fi

          cat > .config <<'EOF'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          EOF

          make defconfig

          if [ ! -f tmp/.config-target.in ]; then
            echo "ERROR: tmp/.config-target.in was not generated."
            exit 1
          fi

          PROFILE_SYMBOL="$(
            python3 - tmp/.config-target.in "$DEVICE_ID" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          device_id = sys.argv[2].lower()
          text = path.read_text(encoding="utf-8", errors="ignore")

          blocks = re.split(r"(?m)(?=^config\s+)", text)
          candidates = []

          for block in blocks:
              header = re.match(r"^config\s+(\S+)", block)

              if not header:
                  continue

              symbol = header.group(1)

              if not symbol.startswith("TARGET_ath79_generic_DEVICE_"):
                  continue

              lower = block.lower()

              if device_id in lower or "minibox" in lower:
                  candidates.append(symbol)

          candidates = sorted(set(candidates))

          if not candidates:
              raise SystemExit(1)

          print(candidates[0])
          PY
          )"

          if [ -z "$PROFILE_SYMBOL" ]; then
            echo "ERROR: Could not detect the generated MiniBox Kconfig symbol."
            grep -ni -C 4 'minibox' tmp/.config-target.in || true
            exit 1
          fi

          echo "Detected Kconfig profile symbol:"
          echo "$PROFILE_SYMBOL"

          ./scripts/config \
            --enable TARGET_ath79 \
            --enable TARGET_ath79_generic \
            --enable "$PROFILE_SYMBOL" \
            --enable TARGET_ROOTFS_SQUASHFS \
            --enable TARGET_ROOTFS_INITRAMFS \
            --enable TARGET_INITRAMFS_COMPRESSION_LZMA \
            --enable PACKAGE_minibox-mfp \
            --enable PACKAGE_libusb-1.0 \
            --enable PACKAGE_kmod-usb2 \
            --enable PACKAGE_ubus \
            --enable PACKAGE_uci \
            --enable PACKAGE_uhttpd \
            --disable PACKAGE_kmod-usb-printer

          make defconfig

          echo "PROFILE_SYMBOL=$PROFILE_SYMBOL" >> "$GITHUB_ENV"

          echo
          echo "Selected configuration:"
          grep -E \
            'CONFIG_TARGET_ath79|DEVICE_.*[Mm]inibox|CONFIG_PACKAGE_minibox-mfp|CONFIG_TARGET_ROOTFS_INITRAMFS|CONFIG_PACKAGE_libusb' \
            .config || true

          if ! grep -Fqx \
            "CONFIG_${PROFILE_SYMBOL}=y" \
            .config; then
            echo "ERROR: MiniBox profile was removed by make defconfig."
            echo "Expected: CONFIG_${PROFILE_SYMBOL}=y"
            exit 1
          fi

          if ! grep -q \
            '^CONFIG_PACKAGE_minibox-mfp=y$' \
            .config; then
            echo "ERROR: MiniBox-MFP package is not selected."
            exit 1
          fi

          if ! grep -q \
            '^CONFIG_TARGET_ROOTFS_INITRAMFS=y$' \
            .config; then
            echo "ERROR: initramfs image generation is not enabled."
            exit 1
          fi

          if grep -q \
            '^CONFIG_PACKAGE_kmod-usb-printer=y$' \
            .config; then
            echo "ERROR: forbidden usblp package is enabled."
            exit 1
          fi

      - name: Download OpenWrt sources
        shell: bash
        working-directory: openwrt-src
        run: |
          set -o pipefail

          make -j"$(nproc)" download 2>&1 \
            | tee "$GITHUB_WORKSPACE/download.log" || {
              echo
              echo "Parallel download failed. Retrying serially."
              make -j1 V=s download 2>&1 \
                | tee -a "$GITHUB_WORKSPACE/download.log"
            }

      - name: Build firmware
        shell: bash
        working-directory: openwrt-src
        run: |
          set -o pipefail

          make -j"$(nproc)" 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log" || {
              echo
              echo "Parallel build failed."
              echo "Retrying with one job and verbose output."
              echo
              make -j1 V=s 2>&1 \
                | tee -a "$GITHUB_WORKSPACE/build.log"
            }

      - name: Collect and verify firmware images
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR"

          TARGET_DIR="$OPENWRT_DIR/bin/targets/ath79/generic"

          if [ ! -d "$TARGET_DIR" ]; then
            echo "ERROR: OpenWrt target output directory is missing:"
            echo "$TARGET_DIR"
            exit 1
          fi

          while IFS= read -r -d '' file; do
            cp -v "$file" "$DIST_DIR/"
          done < <(
            find "$TARGET_DIR" \
              -maxdepth 1 \
              -type f \
              \( \
                -iname "*${DEVICE_ID}*.bin" \
                -o -iname '*minibox*.bin' \
                -o -name 'sha256sums' \
                -o -name 'profiles.json' \
                -o -name '*.buildinfo' \
                -o -name '*.manifest' \
              \) \
              -print0
          )

          INITRAMFS="$(find "$DIST_DIR" \
            -maxdepth 1 \
            -type f \
            -iname '*minibox*initramfs-kernel.bin' \
            -print -quit)"

          SYSUPGRADE="$(find "$DIST_DIR" \
            -maxdepth 1 \
            -type f \
            -iname '*minibox*squashfs-sysupgrade.bin' \
            -print -quit)"

          if [ -z "$INITRAMFS" ]; then
            echo "ERROR: MiniBox initramfs-kernel image was not generated."
            echo
            echo "All target output files:"
            find "$TARGET_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          if [ -z "$SYSUPGRADE" ]; then
            echo "ERROR: MiniBox squashfs-sysupgrade image was not generated."
            echo
            echo "All target output files:"
            find "$TARGET_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          (
            cd "$DIST_DIR"
            sha256sum ./* > BUILD-0104-SHA256SUMS.txt
          )

          cat > "$DIST_DIR/READ-ME-FIRST.txt" <<EOF
          MiniBox-MFP Build-0104 candidate firmware images
          =================================================

          Device ID: ${DEVICE_ID}
          OpenWrt: ${OPENWRT_TAG}
          Target: ath79/generic
          SoC: Qualcomm Atheros AR9330
          Flash: 16 MiB
          RAM: 64 MiB

          IMPORTANT:
          1. First test ONLY the initramfs-kernel image by RAM boot.
          2. Do NOT write the sysupgrade image to flash yet.
          3. Verify Ethernet LAN.
          4. Verify Wi-Fi and ART calibration.
          5. Verify USB enumeration.
          6. Verify physical printing through libusb.
          7. usblp must not be used.

          flash_allowed=false
          EOF

          echo
          echo "Generated MiniBox files:"
          ls -lah "$DIST_DIR"

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: minibox-v1-openwrt-25.12.5-build0104
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: minibox-v1-build0104-diagnostics
          path: |
            build.log
            download.log
            extracted-tree.txt
            openwrt-src/.config
            openwrt-src/tmp/.config-target.in
          if-no-files-found: ignore
          retention-days: 14
