name: Build MiniBox firmware from ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minibox-build-0104
  cancel-in-progress: false

env:
  ARCHIVE: MiniBox-MFP-Firmware-Build-0104-AR9330-OPENWRT-25.12.5-CANDIDATE-BUILD-KIT.zip
  EXPECTED_SHA256: 77974510f54a23dd633d5f451eac72cec432116bb01710a46bd0b8bb3f050381
  OPENWRT_TAG: v25.12.5
  OPENWRT_DIR: openwrt-src
  DIST_DIR: dist

jobs:
  build:
    name: OpenWrt 25.12.5 / MiniBox V1
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check ZIP and SHA-256
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: ZIP archive is missing from the repository root:"
            echo "$ARCHIVE"
            exit 1
          fi

          echo "$EXPECTED_SHA256  $ARCHIVE" | sha256sum -c -

      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          df -h

      - name: Install OpenWrt build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            autoconf \
            automake \
            autopoint \
            bison \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            file \
            flex \
            g++ \
            g++-multilib \
            gawk \
            gcc-multilib \
            gettext \
            git \
            jq \
            libelf-dev \
            libgmp-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses-dev \
            libssl-dev \
            libtool \
            libzstd-dev \
            ninja-build \
            patch \
            perl \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            rsync \
            subversion \
            swig \
            tar \
            unzip \
            wget \
            xz-utils \
            zlib1g-dev \
            zstd

      - name: Extract Build-0104 ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ARCHIVE" -d extracted

          KIT_ROOT="$(find extracted -type f -name BUILD_INFO.md -printf '%h\n' -quit)"

          if [ -z "$KIT_ROOT" ] || [ ! -d "$KIT_ROOT" ]; then
            echo "ERROR: Cannot determine the Build-0104 root directory."
            find extracted -maxdepth 6 -print
            exit 1
          fi

          KIT_ROOT="$(realpath "$KIT_ROOT")"
          echo "KIT_ROOT=$KIT_ROOT" >> "$GITHUB_ENV"

          find "$KIT_ROOT" -maxdepth 8 -type f | sort > extracted-tree.txt

          echo "Build kit root: $KIT_ROOT"
          echo
          echo "Important bundled files:"
          ls -l \
            "$KIT_ROOT/scripts/inject-openwrt-tree.py" \
            "$KIT_ROOT/openwrt.config" \
            "$KIT_ROOT/board-port/device.mk" \
            "$KIT_ROOT/board-port/02_network.fragment" \
            "$KIT_ROOT/board-port/target/linux/ath79/dts/ar9330_gainstrong_minibox-v1.dts" \
            "$KIT_ROOT/package/minibox-mfp/Makefile"

      - name: Run bundled host validation
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$KIT_ROOT/scripts/run-host-validation.sh" ]; then
            chmod +x "$KIT_ROOT/scripts/run-host-validation.sh"
            (
              cd "$KIT_ROOT"
              bash scripts/run-host-validation.sh
            ) 2>&1 | tee "$GITHUB_WORKSPACE/host-validation.log"
          else
            echo "Bundled host validation script is absent; continuing."
          fi

      - name: Clone pinned OpenWrt source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$OPENWRT_DIR"
          git clone \
            --depth 1 \
            --branch "$OPENWRT_TAG" \
            https://git.openwrt.org/openwrt/openwrt.git \
            "$OPENWRT_DIR"

          git -C "$OPENWRT_DIR" describe --tags --exact-match

      - name: Inject board port with bundled injector
        shell: bash
        run: |
          set -euo pipefail

          DEST="$(realpath "$OPENWRT_DIR")"
          INJECTOR="$KIT_ROOT/scripts/inject-openwrt-tree.py"

          if [ ! -f "$INJECTOR" ]; then
            echo "ERROR: Bundled injector is missing: $INJECTOR"
            exit 1
          fi

          echo "Bundled injector arguments:"
          grep -nE 'add_argument|ArgumentParser|usage=' "$INJECTOR" \
            | head -n 80 \
            | tee injector-arguments.txt || true

          reset_openwrt() {
            git -C "$DEST" reset --hard HEAD >/dev/null
            git -C "$DEST" clean -fdx >/dev/null
          }

          profile_present() {
            grep -Rqs 'gainstrong_minibox-v1' "$DEST/target/linux/ath79"
          }

          attempt() {
            local description="$1"
            shift

            echo
            echo "=== Injector attempt: $description ==="
            reset_openwrt

            if (
              cd "$KIT_ROOT"
              python3 "$INJECTOR" "$@"
            ) 2>&1 | tee injector-last-attempt.log; then
              if profile_present; then
                echo "Injector attempt succeeded: $description"
                return 0
              fi

              echo "Injector returned success, but the MiniBox profile is absent."
            else
              echo "Injector attempt failed: $description"
            fi

            return 1
          }

          if attempt "one positional OpenWrt path" "$DEST"; then
            :
          elif attempt "--openwrt path" --openwrt "$DEST"; then
            :
          elif attempt "--openwrt-root path" --openwrt-root "$DEST"; then
            :
          elif attempt "--tree path" --tree "$DEST"; then
            :
          elif attempt "kit path plus OpenWrt path" "$KIT_ROOT" "$DEST"; then
            :
          else
            echo
            echo "ERROR: Could not run the bundled injector with any supported form."
            echo "The injector source follows for diagnosis:"
            sed -n '1,320p' "$INJECTOR"
            exit 1
          fi

          rm -rf "$DEST/package/minibox-mfp"
          cp -a "$KIT_ROOT/package/minibox-mfp" "$DEST/package/minibox-mfp"

          if ! profile_present; then
            echo "ERROR: gainstrong_minibox-v1 was not injected."
            exit 1
          fi

          if [ ! -f "$DEST/package/minibox-mfp/Makefile" ]; then
            echo "ERROR: package/minibox-mfp/Makefile was not copied."
            exit 1
          fi

          echo
          echo "Injected MiniBox references:"
          grep -Rni 'gainstrong_minibox-v1\|minibox-v1' \
            "$DEST/target/linux/ath79" \
            | head -n 160 \
            | tee injected-minibox-references.txt

      - name: Configure OpenWrt from bundled config
        shell: bash
        working-directory: openwrt-src
        run: |
          set -euo pipefail

          if [ ! -f "$KIT_ROOT/openwrt.config" ]; then
            echo "ERROR: Bundled openwrt.config is missing."
            exit 1
          fi

          cp "$KIT_ROOT/openwrt.config" .config

          ./scripts/config \
            --enable TARGET_ROOTFS_SQUASHFS \
            --enable TARGET_ROOTFS_INITRAMFS \
            --enable PACKAGE_minibox-mfp \
            --enable PACKAGE_libusb-1.0 \
            --enable PACKAGE_kmod-usb2 \
            --disable PACKAGE_kmod-usb-printer

          make defconfig
          cp .config "$GITHUB_WORKSPACE/final-openwrt.config"

          echo "Selected MiniBox configuration:"
          grep -E \
            'CONFIG_TARGET_ath79|gainstrong_minibox|CONFIG_PACKAGE_minibox-mfp|CONFIG_TARGET_ROOTFS_INITRAMFS|CONFIG_PACKAGE_libusb|CONFIG_PACKAGE_kmod-usb-printer' \
            .config || true

          if ! grep -q '^CONFIG_TARGET_ath79_generic_DEVICE_gainstrong_minibox-v1=y$' .config; then
            echo "ERROR: gainstrong_minibox-v1 target is not selected."
            grep -ni -C 5 'minibox' .config tmp/.config-target.in 2>/dev/null || true
            exit 1
          fi

          if ! grep -q '^CONFIG_PACKAGE_minibox-mfp=y$' .config; then
            echo "ERROR: minibox-mfp package is not selected."
            exit 1
          fi

          if ! grep -q '^CONFIG_TARGET_ROOTFS_INITRAMFS=y$' .config; then
            echo "ERROR: initramfs generation is not enabled."
            exit 1
          fi

          if grep -q '^CONFIG_PACKAGE_kmod-usb-printer=y$' .config; then
            echo "ERROR: forbidden usblp package is enabled."
            exit 1
          fi

      - name: Download OpenWrt sources
        shell: bash
        working-directory: openwrt-src
        run: |
          set -o pipefail

          make -j"$(nproc)" download 2>&1 \
            | tee "$GITHUB_WORKSPACE/download.log" || {
              echo
              echo "Parallel download failed. Retrying serially."
              make -j1 V=s download 2>&1 \
                | tee -a "$GITHUB_WORKSPACE/download.log"
            }

          BAD_DOWNLOADS="$(find dl -type f -size -1024c -print || true)"
          if [ -n "$BAD_DOWNLOADS" ]; then
            echo "ERROR: Incomplete downloaded files:"
            echo "$BAD_DOWNLOADS"
            exit 1
          fi

      - name: Build firmware
        shell: bash
        working-directory: openwrt-src
        run: |
          set -o pipefail

          make -j"$(nproc)" 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log" || {
              echo
              echo "Parallel build failed. Retrying serially with V=s."
              make -j1 V=s 2>&1 \
                | tee -a "$GITHUB_WORKSPACE/build.log"
            }

      - name: Collect and verify firmware images
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR"

          TARGET_DIR="$OPENWRT_DIR/bin/targets/ath79/generic"

          if [ ! -d "$TARGET_DIR" ]; then
            echo "ERROR: OpenWrt target output directory is missing: $TARGET_DIR"
            exit 1
          fi

          find "$TARGET_DIR" -maxdepth 1 -type f -printf '%f\n' \
            | sort \
            | tee target-output-files.txt

          while IFS= read -r -d '' file; do
            cp -v "$file" "$DIST_DIR/"
          done < <(
            find "$TARGET_DIR" \
              -maxdepth 1 \
              -type f \
              \( \
                -iname '*gainstrong_minibox-v1*.bin' \
                -o -iname '*minibox*.bin' \
                -o -name 'sha256sums' \
                -o -name 'profiles.json' \
                -o -name '*.buildinfo' \
                -o -name '*.manifest' \
                -o -name '*.json' \
              \) \
              -print0
          )

          INITRAMFS="$(find "$DIST_DIR" \
            -maxdepth 1 \
            -type f \
            -iname '*minibox*initramfs-kernel.bin' \
            -print -quit)"

          SYSUPGRADE="$(find "$DIST_DIR" \
            -maxdepth 1 \
            -type f \
            -iname '*minibox*squashfs-sysupgrade.bin' \
            -print -quit)"

          if [ -z "$INITRAMFS" ]; then
            echo "ERROR: MiniBox initramfs-kernel image was not generated."
            cat target-output-files.txt
            exit 1
          fi

          if [ -z "$SYSUPGRADE" ]; then
            echo "ERROR: MiniBox squashfs-sysupgrade image was not generated."
            cat target-output-files.txt
            exit 1
          fi

          (
            cd "$DIST_DIR"
            sha256sum ./* > BUILD-0104-SHA256SUMS.txt
          )

          cat > "$DIST_DIR/READ-ME-FIRST.txt" <<'EOF'
          MiniBox-MFP Build-0104 candidate firmware images
          =================================================

          DEVICE:
          Gainstrong MiniBox V1.0
          Qualcomm Atheros AR9330
          Flash: 16 MiB
          RAM: 64 MiB

          SAFETY:
          1. First test ONLY the initramfs-kernel image by RAM boot.
          2. Do NOT write the sysupgrade image to flash yet.
          3. Verify Ethernet LAN.
          4. Verify Wi-Fi and ART calibration.
          5. Verify USB enumeration.
          6. Verify physical printing through libusb.
          7. usblp must not be used.

          flash_allowed=false
          EOF

          echo
          echo "Generated MiniBox files:"
          ls -lah "$DIST_DIR"

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: minibox-v1-openwrt-25.12.5-build0104
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: minibox-v1-build0104-diagnostics-v4
          path: |
            build.log
            download.log
            host-validation.log
            extracted-tree.txt
            injector-arguments.txt
            injector-last-attempt.log
            injected-minibox-references.txt
            target-output-files.txt
            final-openwrt.config
            openwrt-src/tmp/.config-target.in
          if-no-files-found: ignore
          retention-days: 14
